loadLevel(0);

function setMode(newMode) {
  mode = newMode;
  loadLevel(currentLevel);
}

function loadLevel(lvl) {
  currentLevel = lvl;
  const start = lvl * QUESTIONS_PER_LEVEL;
  const levelQuestions = questions.slice(start, start + QUESTIONS_PER_LEVEL);
  
  document.getElementById('level-header').innerHTML = 
    `<h2>Level ${lvl + 1} (${mode === 'guided' ? 'Guided Mode' : 'Exam Simulation'})</h2>`;
  
  const container = document.getElementById('quiz-area');
  container.innerHTML = '';
  document.getElementById('result-area').innerHTML = '';

  levelQuestions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <p><strong>Q${idx + 1} (${q.type}):</strong> ${q.question}</p>
      <input type="text" id="ans-${idx}" placeholder="Enter your answer...">
      ${mode === 'guided' ? `
        <button class="secondary-btn" style="margin-top:8px;" onclick="toggleHints(${idx})">💡 Hint</button>
        <div class="hint-box" id="hint-${idx}">
          ${(q.hints || []).map(h => `<p>• ${h}</p>`).join('')}
        </div>
      ` : ''}
      <div class="solution-box" id="sol-${idx}">
        <strong>Answer:</strong> ${q.correct_answer}<br>
        <strong>Steps:</strong><br>${(q.solution_steps || []).join('<br>')}
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById('submit-btn').style.display = 'block';
}

function toggleHints(idx) {
  const el = document.getElementById(`hint-${idx}`);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}

function evaluateLevel() {
  const start = currentLevel * QUESTIONS_PER_LEVEL;
  const levelQuestions = questions.slice(start, start + QUESTIONS_PER_LEVEL);
  let correct = 0;

  levelQuestions.forEach((q, idx) => {
    const sol = document.getElementById(`sol-${idx}`);
    sol.style.display = 'block'; // Reveal solutions
    const userVal = document.getElementById(`ans-${idx}`).value.trim().toLowerCase();
    const correctVal = String(q.correct_answer).trim().toLowerCase();

    if (userVal.length > 0 && correctVal.includes(userVal)) {
      correct++;
    }
  });

  const percentage = (correct / levelQuestions.length) * 100;
  const passed = percentage >= 80;

  document.getElementById('result-area').innerHTML = `
    <div class="score-badge">
      Score: ${correct} / ${levelQuestions.length} (${percentage.toFixed(0)}%)
      <br>
      ${passed ? "✅ Passed (>= 80%)! You unlocked the next level." : "❌ Not Passed (< 80%). Review the steps and try again."}
    </div>
    ${passed && (currentLevel + 1) * QUESTIONS_PER_LEVEL < questions.length 
      ? `<button style="margin-top:15px;" onclick="loadLevel(${currentLevel + 1})">Next Level ➔</button>` 
      : ''}
  `;
}
